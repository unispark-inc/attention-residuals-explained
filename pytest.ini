[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    html: HTML structure and validation tests
    css: CSS validation tests
    js: JavaScript tests
    accessibility: Accessibility tests
    integrity: Link and reference integrity tests
    build: Build and deployment tests
    responsive: Responsive design tests
    performance: Performance optimization tests
